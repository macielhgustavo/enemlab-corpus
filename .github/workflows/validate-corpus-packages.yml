name: Validate corpus packages

on:
  pull_request:
    paths:
      - 'sources/*.json'
      - 'scripts/build_corpus_packages.py'
      - '.github/workflows/validate-corpus-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package candidates
        id: package_build
        continue-on-error: true
        run: python scripts/build_corpus_packages.py --output-dir .cache/package-validation

      - name: Save validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-package-validation
          path: .cache/package-validation/
          retention-days: 7
          if-no-files-found: error

      - name: Assert complete package build
        if: steps.package_build.outcome == 'failure'
        run: |
          cat .cache/package-validation/corpus-release.json
          exit 1
