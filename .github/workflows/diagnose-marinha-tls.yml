name: Diagnose Marinha TLS

on:
  push:
    branches: [work/marinha-30]
    paths:
      - '.github/workflows/diagnose-marinha-tls.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect assets TLS chain
        shell: bash
        run: |
          set -o pipefail
          HOST=assets.marinha.mil.br
          echo | openssl s_client -connect "$HOST:443" -servername "$HOST" -showcerts 2>&1 | tee /tmp/tls.txt || true
          awk '/-----BEGIN CERTIFICATE-----/{n++} n==1{print} /-----END CERTIFICATE-----/ && n==1{exit}' /tmp/tls.txt > /tmp/leaf.pem
          echo '--- LEAF ---'
          openssl x509 -in /tmp/leaf.pem -noout -subject -issuer -dates -fingerprint -sha256
          echo '--- AIA ---'
          openssl x509 -in /tmp/leaf.pem -noout -text | grep -A5 'Authority Information Access' || true
          echo '--- CHAIN VERIFY AS SERVED ---'
          echo | openssl s_client -connect "$HOST:443" -servername "$HOST" -verify_return_error 2>&1 | grep -E 'Verification:|Verify return code|depth=|verify error' || true
