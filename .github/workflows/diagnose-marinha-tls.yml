name: Diagnose Marinha TLS

on:
  push:
    branches: [work/marinha-30]
    paths:
      - '.github/workflows/diagnose-marinha-tls.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TLS chain and archive redirect
        shell: bash
        run: |
          set -o pipefail
          echo | openssl s_client -connect www.marinha.mil.br:443 -servername www.marinha.mil.br -showcerts 2>&1 | tee /tmp/tls.txt || true
          awk '/-----BEGIN CERTIFICATE-----/{n++} n==1{print} /-----END CERTIFICATE-----/ && n==1{exit}' /tmp/tls.txt > /tmp/leaf.pem
          echo '--- LEAF ---'
          openssl x509 -in /tmp/leaf.pem -noout -subject -issuer -dates -fingerprint -sha256
          echo '--- CHAIN VERIFY AS SERVED ---'
          echo | openssl s_client -connect www.marinha.mil.br:443 -servername www.marinha.mil.br -verify_return_error 2>&1 | grep -E 'Verification:|Verify return code|depth=' || true
          echo '--- CURL HEAD / REDIRECTS ---'
          curl --fail --location --head --show-error --max-time 30 --retry 1 'https://www.marinha.mil.br/sspm/sites/www.marinha.mil.br.sspm/files/provas/2020-.zip' || true
