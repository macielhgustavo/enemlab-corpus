name: Fetch military corpus

on:
  push:
    branches: [main]
    paths:
      - 'sources/*military*.json'
      - 'sources/military-*.json'
      - '.github/workflows/fetch-qconcursos-military.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: military-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Complete Marinha assets trust chain
        shell: bash
        run: |
          set -euo pipefail
          # assets.marinha.mil.br currently omits its public intermediate CA.
          # Fetch the exact AIA issuer, then verify that issuer against Ubuntu's
          # trusted roots before allowing it into the downloader's CA bundle.
          curl --fail --location --silent --show-error \
            'http://secure.globalsign.com/acdefesagr3ovtlsca2023.crt' \
            -o /tmp/acdefesa-gr3.crt
          if openssl x509 -inform DER -in /tmp/acdefesa-gr3.crt -out /tmp/acdefesa-gr3.pem 2>/dev/null; then
            :
          else
            openssl x509 -in /tmp/acdefesa-gr3.crt -out /tmp/acdefesa-gr3.pem
          fi
          SUBJECT="$(openssl x509 -in /tmp/acdefesa-gr3.pem -noout -subject)"
          echo "$SUBJECT"
          echo "$SUBJECT" | grep -F 'AC Defesa GR3 OV TLS CA 2023'
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt /tmp/acdefesa-gr3.pem
          cat /etc/ssl/certs/ca-certificates.crt /tmp/acdefesa-gr3.pem > /tmp/military-ca-bundle.pem

      - name: Download source files and build packages
        shell: bash
        env:
          SSL_CERT_FILE: /tmp/military-ca-bundle.pem
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          manifest_paths = sorted({
              *Path("sources").glob("qconcursos-military*.json"),
              *Path("sources").glob("military-*.json"),
          })
          if not manifest_paths:
              raise RuntimeError("no military corpus manifests found")

          merged = {}
          for manifest_path in manifest_paths:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest_source = str(manifest.get("source") or "QConcursos")
              for collection in manifest["collections"]:
                  slug = collection["id"]
                  current = merged.setdefault(slug, {
                      "id": slug,
                      "display_name": collection["display_name"],
                      "exams": [],
                      "source_manifests": [],
                      "sources": [],
                  })
                  current["exams"].extend(collection["exams"])
                  current["source_manifests"].append(str(manifest_path))
                  source = str(collection.get("source") or manifest_source)
                  if source not in current["sources"]:
                      current["sources"].append(source)

          work_root = Path(".cache/military-corpus")
          shutil.rmtree(work_root, ignore_errors=True)
          work_root.mkdir(parents=True, exist_ok=True)

          opener = urllib.request.build_opener()
          opener.addheaders = [
              ("User-Agent", "Mozilla/5.0 (compatible; enemlab-corpus/1.1; +https://github.com/macielhgustavo/enemlab-corpus)"),
              ("Accept", "application/pdf,application/zip,application/octet-stream,*/*;q=0.8"),
          ]

          def validate_file(dest: Path, file_format: str, url: str) -> None:
              raw = dest.read_bytes()
              if len(raw) < 1024:
                  raise RuntimeError(f"download is implausibly small ({len(raw)} bytes): {url}")
              if file_format == "pdf":
                  if not raw.lstrip().startswith(b"%PDF"):
                      raise RuntimeError(f"download is not a valid PDF: {url}")
              elif file_format == "zip":
                  if not zipfile.is_zipfile(dest):
                      raise RuntimeError(f"download is not a valid ZIP: {url}")
                  with zipfile.ZipFile(dest) as archive:
                      members = [info for info in archive.infolist() if not info.is_dir()]
                      if not members:
                          raise RuntimeError(f"ZIP archive is empty: {url}")
                      bad = archive.testzip()
                      if bad is not None:
                          raise RuntimeError(f"ZIP CRC failed at {bad}: {url}")
              else:
                  raise RuntimeError(f"unsupported source format {file_format!r}: {url}")

          def download(url: str, dest: Path, file_format: str) -> tuple[str, int]:
              last_error = None
              for attempt in range(4):
                  try:
                      with opener.open(url, timeout=90) as response, dest.open("wb") as out:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)
                      validate_file(dest, file_format, url)
                      raw = dest.read_bytes()
                      return hashlib.sha256(raw).hexdigest(), len(raw)
                  except Exception as exc:
                      last_error = exc
                      if dest.exists():
                          dest.unlink()
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"failed after retries: {url}: {last_error}")

          def eear_bucket(year: int) -> str:
              if year >= 2023:
                  return "eear-2023-2025"
              if year >= 2020:
                  return "eear-2020-2022"
              return "eear-pre2020"

          packages = []
          for collection in merged.values():
              slug = collection["id"]
              common = {
                  "collection_id": slug,
                  "display_name": collection["display_name"],
                  "source_manifests": collection["source_manifests"],
                  "sources": collection["sources"],
              }
              if slug == "eear":
                  groups = {}
                  for exam in collection["exams"]:
                      year = int(exam["year"])
                      groups.setdefault(eear_bucket(year), []).append(exam)
                  for package_id, exams in sorted(groups.items()):
                      packages.append({**common, "package_id": package_id, "exams": exams})
              elif slug == "esa":
                  exams = [exam for exam in collection["exams"] if "geral" in exam.get("label", "").lower()]
                  packages.append({**common, "package_id": slug, "exams": exams})
              else:
                  packages.append({**common, "package_id": slug, "exams": collection["exams"]})

          built = []
          total_exams = 0
          for package in packages:
              package_id = package["package_id"]
              collection_dir = work_root / package_id
              collection_dir.mkdir(parents=True, exist_ok=True)
              resolved = []
              seen_filenames = set()

              for exam in sorted(package["exams"], key=lambda e: (int(e["year"]), e.get("label", ""))):
                  if not exam.get("files"):
                      raise RuntimeError(f"exam has no verified direct files: {exam.get('label')}")
                  resolved_exam = {k: v for k, v in exam.items() if k != "files"}
                  resolved_files = []
                  for item in exam["files"]:
                      filename = item["filename"]
                      if filename in seen_filenames:
                          raise RuntimeError(f"duplicate filename in {package_id}: {filename}")
                      seen_filenames.add(filename)

                      declared_kind = str(item.get("kind") or "").lower()
                      declared_format = str(item.get("format") or "").lower()
                      if declared_format:
                          file_format = declared_format
                      elif declared_kind in {"pdf", "zip"}:
                          file_format = declared_kind
                      else:
                          # Schema v1 QConcursos manifests use `kind` as a role
                          # (`prova`/`gabarito`), and every such legacy file is PDF.
                          file_format = "pdf"
                      if file_format not in {"pdf", "zip"}:
                          raise RuntimeError(f"{exam.get('label')}: unsupported file format {file_format!r}")

                      dest = collection_dir / filename
                      sha256, size = download(item["url"], dest, file_format)
                      resolved_files.append({**item, "format": file_format, "sha256": sha256, "size_bytes": size})
                      print(f"{package_id}: {dest.name} {file_format} {size} bytes {sha256}")
                  resolved_exam["files"] = resolved_files
                  resolved.append(resolved_exam)
                  total_exams += 1

              packaged_manifest = {
                  "schema_version": 1,
                  "package_id": package_id,
                  "collection": package["collection_id"],
                  "display_name": package["display_name"],
                  "source": package["sources"][0] if len(package["sources"]) == 1 else package["sources"],
                  "generated_from": package["source_manifests"],
                  "exams": resolved,
              }
              (collection_dir / "manifest.json").write_text(
                  json.dumps(packaged_manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )

              hashes = []
              for path in sorted(collection_dir.iterdir()):
                  if not path.is_file() or path.name in {"manifest.json", "SHA256SUMS.txt"}:
                      continue
                  hashes.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
              (collection_dir / "SHA256SUMS.txt").write_text("\n".join(hashes) + "\n", encoding="utf-8")

              zip_path = Path(f"{package_id}.zip")
              if zip_path.exists():
                  zip_path.unlink()
              shutil.make_archive(package_id, "zip", root_dir=collection_dir)
              size = zip_path.stat().st_size
              if size >= 95 * 1024 * 1024:
                  raise RuntimeError(f"{zip_path} reached 95 MiB; split this package into a smaller year range")
              built.append({
                  "asset": zip_path.name,
                  "collection": package["collection_id"],
                  "exam_count": len(resolved),
                  "size_bytes": size,
                  "sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              })

          release_index = {
              "schema_version": 2,
              "release_tag": "corpus-latest",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "source_manifests": [str(path) for path in manifest_paths],
              "exam_count": total_exams,
              "assets": built,
          }
          Path("corpus-release.json").write_text(
              json.dumps(release_index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(release_index, indent=2))
          PY

      - name: Upload validation artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: military-corpus-validation
          path: |
            corpus-release.json
            escola-naval.zip
            colegio-naval.zip
            eam.zip
            c-fsd-fn.zip
          retention-days: 2

      - name: Publish corpus release assets
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="corpus-latest"
          TITLE="ENEMLab corpus (latest)"
          NOTES="Generated corpus packages. Source of truth: versioned manifests under sources/. Assets are rebuilt and replaced on manifest changes."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

          mapfile -t ASSETS < <(python - <<'PY'
          import json
          for item in json.load(open('corpus-release.json', encoding='utf-8'))['assets']:
              print(item['asset'])
          PY
          )
          gh release upload "$TAG" "${ASSETS[@]}" corpus-release.json --clobber
