name: Fetch QConcursos military corpus

on:
  push:
    branches: [main]
    paths:
      - sources/qconcursos-military.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qconcursos-military-corpus
  cancel-in-progress: false

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFs and build ZIPs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import time
          import urllib.request
          from pathlib import Path

          manifest_path = Path("sources/qconcursos-military.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          work_root = Path(".cache/qconcursos-military")
          shutil.rmtree(work_root, ignore_errors=True)
          work_root.mkdir(parents=True, exist_ok=True)

          opener = urllib.request.build_opener()
          opener.addheaders = [
              ("User-Agent", "Mozilla/5.0 (compatible; enemlab-corpus/1.0; +https://github.com/macielhgustavo/enemlab-corpus)"),
              ("Accept", "application/pdf,*/*;q=0.8"),
          ]

          def download(url: str, dest: Path) -> tuple[str, int]:
              last_error = None
              for attempt in range(4):
                  try:
                      with opener.open(url, timeout=60) as response, dest.open("wb") as out:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)
                      raw = dest.read_bytes()
                      if len(raw) < 1024 or not raw.startswith(b"%PDF"):
                          raise RuntimeError(f"download is not a valid PDF: {url}")
                      return hashlib.sha256(raw).hexdigest(), len(raw)
                  except Exception as exc:
                      last_error = exc
                      if dest.exists():
                          dest.unlink()
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"failed after retries: {url}: {last_error}")

          built = []
          for collection in manifest["collections"]:
              slug = collection["id"]
              collection_dir = work_root / slug
              collection_dir.mkdir(parents=True, exist_ok=True)
              resolved = []

              for exam in collection["exams"]:
                  resolved_exam = {k: v for k, v in exam.items() if k != "files"}
                  resolved_files = []
                  for item in exam["files"]:
                      dest = collection_dir / item["filename"]
                      sha256, size = download(item["url"], dest)
                      resolved_files.append({
                          **item,
                          "sha256": sha256,
                          "size_bytes": size,
                      })
                      print(f"{slug}: {dest.name} {size} bytes {sha256}")
                  resolved_exam["files"] = resolved_files
                  resolved.append(resolved_exam)

              packaged_manifest = {
                  "schema_version": 1,
                  "collection": slug,
                  "display_name": collection["display_name"],
                  "source": "QConcursos",
                  "generated_from": "sources/qconcursos-military.json",
                  "exams": resolved,
              }
              (collection_dir / "manifest.json").write_text(
                  json.dumps(packaged_manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

              hashes = []
              for path in sorted(collection_dir.glob("*.pdf")):
                  hashes.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
              (collection_dir / "SHA256SUMS.txt").write_text("\n".join(hashes) + "\n", encoding="utf-8")

              zip_path = Path(f"{slug}.zip")
              if zip_path.exists():
                  zip_path.unlink()
              shutil.make_archive(slug, "zip", root_dir=collection_dir)
              size = zip_path.stat().st_size
              if size >= 95 * 1024 * 1024:
                  raise RuntimeError(f"{zip_path} is too large for a normal GitHub blob: {size} bytes")
              built.append({"zip": zip_path.name, "size_bytes": size})

          print(json.dumps({"built": built}, indent=2))
          PY

      - name: Commit generated corpus ZIPs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eear.zip esa.zip espcex.zip
          if git diff --cached --quiet; then
            echo "Corpus ZIPs are already up to date."
            exit 0
          fi
          git commit -m "corpus: add QConcursos military exams [skip ci]"
          git push
