name: Build corpus packages

on:
  pull_request:
    paths:
      - 'sources/*.json'
      - '.github/workflows/fetch-qconcursos-military.yml'
  push:
    branches: [main]
    paths:
      - 'sources/*.json'
      - '.github/workflows/fetch-qconcursos-military.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpus-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFs and build ZIPs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import time
          import urllib.request
          from pathlib import Path

          manifest_paths = sorted(Path("sources").glob("*.json"))
          if not manifest_paths:
              raise RuntimeError("no corpus source manifests found")

          merged = {}
          for manifest_path in manifest_paths:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("schema_version") != 1:
                  raise RuntimeError(f"unsupported schema in {manifest_path}")
              source_name = str(manifest.get("source") or "unknown")
              for collection in manifest.get("collections", []):
                  slug = collection["id"]
                  current = merged.setdefault(slug, {
                      "id": slug,
                      "display_name": collection["display_name"],
                      "exams": [],
                      "source_manifests": [],
                      "source_names": set(),
                  })
                  current["exams"].extend(collection["exams"])
                  current["source_manifests"].append(str(manifest_path))
                  current["source_names"].add(source_name)

          work_root = Path(".cache/corpus-build")
          asset_root = Path(".cache/release-assets")
          shutil.rmtree(work_root, ignore_errors=True)
          shutil.rmtree(asset_root, ignore_errors=True)
          work_root.mkdir(parents=True, exist_ok=True)
          asset_root.mkdir(parents=True, exist_ok=True)

          opener = urllib.request.build_opener()
          opener.addheaders = [
              ("User-Agent", "Mozilla/5.0 (compatible; studium-labs-corpus/1.0; +https://github.com/macielhgustavo/enemlab-corpus)"),
              ("Accept", "application/pdf,*/*;q=0.8"),
          ]

          def download(url: str, dest: Path) -> tuple[str, int]:
              last_error = None
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url)
                      with opener.open(request, timeout=90) as response, dest.open("wb") as out:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)
                      raw = dest.read_bytes()
                      if len(raw) < 1024 or not raw.startswith(b"%PDF"):
                          raise RuntimeError(f"download is not a valid PDF: {url}")
                      return hashlib.sha256(raw).hexdigest(), len(raw)
                  except Exception as exc:
                      last_error = exc
                      if dest.exists():
                          dest.unlink()
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"failed after retries: {url}: {last_error}")

          def eear_bucket(year: int) -> str:
              if year >= 2023:
                  return "eear-2023-2025"
              if year >= 2020:
                  return "eear-2020-2022"
              return "eear-pre2020"

          packages = []
          for collection in merged.values():
              slug = collection["id"]
              common = {
                  "collection_id": slug,
                  "display_name": collection["display_name"],
                  "source_manifests": collection["source_manifests"],
                  "source_names": sorted(collection["source_names"]),
              }
              if slug == "eear":
                  groups = {}
                  for exam in collection["exams"]:
                      year = int(exam["year"])
                      groups.setdefault(eear_bucket(year), []).append(exam)
                  for package_id, exams in sorted(groups.items()):
                      packages.append({**common, "package_id": package_id, "exams": exams})
              elif slug == "esa":
                  exams = [
                      exam for exam in collection["exams"]
                      if "geral" in exam.get("label", "").lower()
                  ]
                  packages.append({**common, "package_id": slug, "exams": exams})
              else:
                  packages.append({
                      **common,
                      "package_id": slug,
                      "exams": collection["exams"],
                  })

          built = []
          for package in packages:
              package_id = package["package_id"]
              collection_dir = work_root / package_id
              collection_dir.mkdir(parents=True, exist_ok=True)
              resolved = []
              seen_filenames = set()

              for exam in sorted(package["exams"], key=lambda e: (int(e["year"]), e.get("label", ""))):
                  if not exam.get("files"):
                      raise RuntimeError(f"exam has no direct files: {exam.get('label')}")
                  resolved_exam = {k: v for k, v in exam.items() if k != "files"}
                  resolved_files = []
                  for item in exam["files"]:
                      filename = item["filename"]
                      if filename in seen_filenames:
                          raise RuntimeError(f"duplicate filename in {package_id}: {filename}")
                      seen_filenames.add(filename)
                      dest = collection_dir / filename
                      sha256, size = download(item["url"], dest)
                      resolved_files.append({
                          **item,
                          "sha256": sha256,
                          "size_bytes": size,
                      })
                      print(f"{package_id}: {dest.name} {size} bytes {sha256}")
                  resolved_exam["files"] = resolved_files
                  resolved.append(resolved_exam)

              source_names = package["source_names"]
              packaged_manifest = {
                  "schema_version": 1,
                  "package_id": package_id,
                  "collection": package["collection_id"],
                  "display_name": package["display_name"],
                  "source": source_names[0] if len(source_names) == 1 else " + ".join(source_names),
                  "generated_from": package["source_manifests"],
                  "exams": resolved,
              }
              (collection_dir / "manifest.json").write_text(
                  json.dumps(packaged_manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

              hashes = []
              for path in sorted(collection_dir.glob("*.pdf")):
                  hashes.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
              (collection_dir / "SHA256SUMS.txt").write_text("\n".join(hashes) + "\n", encoding="utf-8")

              base_name = asset_root / package_id
              zip_path = Path(shutil.make_archive(str(base_name), "zip", root_dir=collection_dir))
              size = zip_path.stat().st_size
              if size >= 95 * 1024 * 1024:
                  raise RuntimeError(f"{zip_path} reached 95 MiB; split this package into a smaller range")
              built.append({
                  "asset": zip_path.name,
                  "size_bytes": size,
                  "sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              })

          release_index = {
              "schema_version": 1,
              "release_tag": "corpus-latest",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "source_manifests": [str(path) for path in manifest_paths],
              "assets": built,
          }
          (asset_root / "corpus-release.json").write_text(
              json.dumps(release_index, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(release_index, indent=2))
          PY

      - name: Preserve built packages for review
        uses: actions/upload-artifact@v4
        with:
          name: corpus-packages
          path: .cache/release-assets/
          retention-days: 7

      - name: Publish corpus release assets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="corpus-latest"
          TITLE="Studium Labs corpus (latest)"
          NOTES="Generated document corpus. Source of truth: versioned manifests under sources/. Assets are rebuilt from verified direct URLs; provenance remains in each package manifest."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

          mapfile -t ASSETS < <(python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.cache/release-assets')
          data = json.loads((root / 'corpus-release.json').read_text())
          for item in data['assets']:
              print(root / item['asset'])
          PY
          )
          gh release upload "$TAG" "${ASSETS[@]}" .cache/release-assets/corpus-release.json --clobber
